services:
  server:
    build:
      context: ..
      dockerfile: server/Dockerfile
      target: development
    working_dir: /workspace
    volumes:
      - .:/workspace:Z
      - cargo-registry:/usr/local/cargo/registry
      - cargo-target:/workspace/target
    command: ["cargo", "test", "--locked"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  cargo-registry:
  cargo-target:
