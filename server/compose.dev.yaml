services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: saturn
      POSTGRES_PASSWORD: development-only
      POSTGRES_DB: saturn_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saturn -d saturn_test"]
      interval: 2s
      timeout: 5s
      retries: 30
  server:
    build:
      context: ..
      dockerfile: server/Dockerfile
      target: development
    working_dir: /workspace
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TEST_DATABASE_URL: postgresql://saturn:development-only@postgres/saturn_test
    volumes:
      - .:/workspace:Z
      - cargo-registry:/usr/local/cargo/registry
      - cargo-target:/workspace/target
    command: ["cargo", "test", "--locked"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  cargo-registry:
  cargo-target:
