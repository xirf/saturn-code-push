[package]
name = "saturn-code-push"
version = "0.1.0"
license = "Apache-2.0"
edition = "2024"
rust-version = "1.96"

[dependencies]
argon2 = "0.6.0"
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SQLite is used only by the one-time import command.
rusqlite = { version = "0.41", features = ["bundled"] }
postgres = "0.19"
postgres-native-tls = "0.5"
native-tls = "0.2"
r2d2 = "0.8"
r2d2_postgres = "0.18"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.11.1"
subtle = "2.6"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
tower-http = { version = "0.7.1", features = ["fs", "set-header"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
http-body-util = "0.1"
zip = { version = "9.1.2", default-features = false, features = ["deflate"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
base64 = "0.23.1"

percent-encoding = "2"

reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
openssl = "0.10"

object_store = { version = "0.13", features = ["aws"] }
futures-util = "0.3"
